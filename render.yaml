services:
  - type: web
    name: neirochel-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        value: "google/gemma-4-31b-it:free,minimax/minimax-m3:free,nvidia/nemotron-3-ultra-550b-a55b:free,thinkingmachines/inkling:free"
      - key: ADMIN_ID
        value: "8080874290"
      - key: CHANNEL_USERNAME
        value: "neirochel_official"
