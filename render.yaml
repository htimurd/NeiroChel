услуги:
  - тип: веб
    имя: neirochel-bot
    env: python
    план: бесплатно
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - ключ: PYTHON_VERSION
        значение: "3.12.7"
      - key: TELEGRAM_BOT_TOKEN
        синхронизация: false
      - ключ: OPENROUTER_API_KEY
        синхронизация: false
      - ключ: OPENROUTER_MODELS
        значение: "google/gemma-4-31b-it:free,minimax/minimax-m3:free,nvidia/nemotron-3-ultra-550b-a55b:free,thinkingmachines/inkling:free"
      - ключ: ADMIN_ID
        значение: "8080874290"
      - ключ: CHANNEL_USERNAME
        значение: "neirochel_official"
