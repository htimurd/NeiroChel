services:
  - type: web
    name: neirochel-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "inclusionai/ling-3.0-flash-sante:free"
      - key: ADMIN_ID
        value: "8080874290"
